name: Feature request
description: Suggest an improvement to Hitbox+ or its authoring tools.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work, with an example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing options or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include related issues, screenshots, model examples, or API examples.
