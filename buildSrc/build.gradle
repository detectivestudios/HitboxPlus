plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
apply from: '../gradle/test-bundles.gradle'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
    onlyIf('Build logic test sources are included') { !sourceSets.test.java.isEmpty() }
    doFirst { verifyTestSourceBundle() }
}

tasks.named('jar') { dependsOn tasks.named('test') }
